[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#040B1F"
secondaryBackgroundColor = "#0D204A"
textColor = "#EAF2FF"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[server]
enableXsrfProtection = true
runOnSave = false
